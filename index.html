<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no는 일반 모바일 사파리에서는 무시되지만(접근성 정책),
         웹뷰와 '홈 화면에 추가'로 띄운 창에서는 그대로 먹는다. 더블탭 확대가
         일어나던 곳이 정확히 그 둘이라 touch-action과 같이 건다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFF8E1" />
    <link rel="icon" type="image/png" href="/icon/icon-eng-192-v1.png" />
    <link rel="apple-touch-icon" href="/icon/icon-eng-192-v1.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MiniGame30</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
