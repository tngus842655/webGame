<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no는 일반 모바일 사파리에서는 무시되지만(접근성 정책),
         웹뷰와 '홈 화면에 추가'로 띄운 창에서는 그대로 먹는다. 더블탭 확대가
         일어나던 곳이 정확히 그 둘이라 touch-action과 같이 건다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFF8E1" />
    <!-- 테마는 첫 칠 이전에 정해야 다크로 들어갈 때 밝은 화면이 한 번 스치지 않는다.
         번들은 defer라 여기까지 못 온다 — 저장소 키는 shared/theme.ts와 같아야 한다. -->
    <script>
      ;(function () {
        var saved = localStorage.getItem('webgame:theme')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="icon" type="image/png" href="/icon/icon-eng-192-v1.png" />
    <link rel="apple-touch-icon" href="/icon/icon-eng-192-v1.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MiniGame30</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
